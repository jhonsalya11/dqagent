[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqagent"
version = "0.1.0"
description = "Rule-based data quality checker for messy public CSV datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dateutil>=2.8",
]

[project.scripts]
dqagent = "dqagent.cli:main"

[tool.setuptools.packages.find]
include = ["dqagent*"]
